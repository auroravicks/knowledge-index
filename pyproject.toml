[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grep-knowledge"
version = "0.1.0"
description = "Cross-platform, grep-first local study knowledge tooling"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1,<9",
  "nbformat>=5.10,<6",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
grep-knowledge = "grep_knowledge.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
